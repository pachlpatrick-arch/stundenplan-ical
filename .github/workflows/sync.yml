name: WebUntis iCal Sync

on:
  schedule:
    - cron: '0 */6 * * *'
    - cron: '0 17,18 * * 0'
    - cron: '0 5,6 * * 1'
  workflow_dispatch:

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Netzwerk-Bibliotheken laden
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Skript mit Passwörtern ausführen
      env:
        # Diese beiden Zeilen reichen deine Passwörter jetzt sicher an das Skript weiter!
        UNTIS_USER: ${{ secrets.UNTIS_USER }}
        UNTIS_PASSWORD: ${{ secrets.UNTIS_PASSWORD }}
      run: python script.py

    - name: Datei auf GitHub abspeichern und veröffentlichen
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add stundenplan.ics
        git diff --quiet && git diff --staged --quiet || (git commit -m "Stundenplan automatisch aktualisiert" && git push)
